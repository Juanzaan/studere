<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-label="Studere: your AI study partner">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EDDE"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.5" stop-color="#E8B84A"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF4E7"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes draw {
      from { stroke-dashoffset: 400; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes blink {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }
    .underline { stroke-dasharray: 400; animation: draw 1.6s ease-out 0.4s both; }
    .flow { stroke-dasharray: 6 6; animation: flow 0.8s linear infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .card { animation: rise 0.6s ease-out both; }
    .card:nth-child(2) { animation-delay: 1.0s; }
    .card:nth-child(3) { animation-delay: 1.2s; }
    .card:nth-child(4) { animation-delay: 1.4s; }
    .card:nth-child(5) { animation-delay: 1.6s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .underline, .flow, .cursor, .card, .pulse { animation: none; }
      .card { opacity: 1; }
      .cursor { opacity: 0; }
    }
  </style>

  <rect width="860" height="350" rx="18" fill="url(#hero-bg)"/>
  <rect width="860" height="350" rx="18" fill="none" stroke="#E4D9C4" stroke-width="1"/>

  <!-- Wordmark -->
  <g transform="translate(430,88)">
    <text y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="46" fill="#2A2420">Studere</text>
    <path class="underline" d="M-120 18 Q -40 8, 0 14 T 120 12" stroke="url(#hero-line)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text y="58" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#5C5344">Your AI study partner</text>
  </g>

  <!-- Pipeline -->
  <g transform="translate(0,0)">

    <!-- Card 1: Record -->
    <g class="card" transform="translate(34,170)">
      <rect width="180" height="130" rx="14" fill="url(#card-grad)" stroke="#E0D4BD" stroke-width="1.2"/>
      <circle cx="90" cy="42" r="20" fill="#F5EDDE" stroke="#B8860B" stroke-width="1.6"/>
      <path d="M90 34c-3.6 0-6.5 2.9-6.5 6.5v4c0 3.6 2.9 6.5 6.5 6.5s6.5-2.9 6.5-6.5v-4c0-3.6-2.9-6.5-6.5-6.5z" fill="#B8860B"/>
      <path d="M74 50v2a16 16 0 0 0 32 0v-2M90 68v8M82 78h16" stroke="#B8860B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="90" y="106" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#2A2420">Record</text>
      <text x="90" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6E655C">audio, video or notes</text>
    </g>

    <g transform="translate(222,196)"><path class="flow" d="M0 0h28" stroke="#C89B3C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M24 0l-6-5v10z" fill="#C89B3C"/></g>

    <!-- Card 2: AI -->
    <g class="card" transform="translate(256,170)">
      <rect width="180" height="130" rx="14" fill="url(#card-grad)" stroke="#E0D4BD" stroke-width="1.2"/>
      <circle cx="90" cy="42" r="20" fill="#EAF3EA" stroke="#5B8C5F" stroke-width="1.6"/>
      <rect x="76" y="32" width="28" height="20" rx="5" fill="#5B8C5F"/>
      <path d="M84 36h8M84 41h8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <path class="pulse" d="M66 42h4M20 42h4" stroke="#5B8C5F" stroke-width="2" stroke-linecap="round"/>
      <text x="90" y="106" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#2A2420">Generate</text>
      <text x="90" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6E655C">GPT-4o-mini + Whisper</text>
    </g>

    <g transform="translate(444,196)"><path class="flow" d="M0 0h28" stroke="#C89B3C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M24 0l-6-5v10z" fill="#C89B3C"/></g>

    <!-- Card 3: Study pack -->
    <g class="card" transform="translate(478,170)">
      <rect width="180" height="130" rx="14" fill="url(#card-grad)" stroke="#E0D4BD" stroke-width="1.2"/>
      <circle cx="90" cy="42" r="20" fill="#FDF3DD" stroke="#C89B3C" stroke-width="1.6"/>
      <rect x="72" y="33" width="14" height="18" rx="2" fill="#C89B3C"/>
      <rect x="84" y="33" width="14" height="18" rx="2" fill="#E8B84A"/>
      <path d="M76 38h6M76 43h6M76 48h6M88 38h6M88 43h6M88 48h6" stroke="#FDF3DD" stroke-width="1.5" stroke-linecap="round"/>
      <text x="90" y="106" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#2A2420">Study pack</text>
      <text x="90" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6E655C">summary, cards, quiz, map</text>
    </g>

    <g transform="translate(666,196)"><path class="flow" d="M0 0h28" stroke="#C89B3C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M24 0l-6-5v10z" fill="#C89B3C"/></g>

    <!-- Card 4: Stude -->
    <g class="card" transform="translate(700,170)">
      <rect width="180" height="130" rx="14" fill="url(#card-grad)" stroke="#E0D4BD" stroke-width="1.2"/>
      <circle cx="90" cy="42" r="20" fill="#FBE9E6" stroke="#B45555" stroke-width="1.6"/>
      <rect x="76" y="30" width="28" height="22" rx="11" fill="#B45555"/>
      <path d="M90 33c-4 0-7 3-7 7 0 3.6 2.8 6.4 6.4 6.4h.6v4l4.2-3.4c1.9-.8 2.8-2 2.8-4 0-4-3-6-6-6z" fill="#FFFFFF"/>
      <path class="pulse" d="M76 54h8" stroke="#B45555" stroke-width="2" stroke-linecap="round"/>
      <text x="90" y="106" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#2A2420">Stude</text>
      <text x="90" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6E655C">tutor with session context</text>
    </g>
  </g>

  <!-- Blinking cursor next to tagline -->
  <rect class="cursor" x="596" y="137" width="8" height="16" rx="1.5" fill="#B8860B"/>
</svg>
