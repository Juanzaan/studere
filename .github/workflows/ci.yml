name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLERK_PUBLISHABLE_KEY     - Clerk test-mode publishable key (pk_test_...)
#   CLERK_SECRET_KEY          - Clerk test-mode secret key (sk_test_...)
#   E2E_CLERK_USER_EMAIL      - Email of test user for E2E (e.g. e2e+clerk_test@example.com)
#   NEXT_PUBLIC_BACKEND_URL   - Backend API base URL (e.g. http://localhost:7071 in local dev)
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    # Vitest 4 requires Node >= 20.12 (uses node:util styleText), so Node 18
    # is intentionally not in the matrix anymore.
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Chromium only: the suite is a smoke gate, and installing five browser
      # engines costs more CI minutes than the extra coverage is worth here.
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run test:e2e -- --project=setup --project=chromium
        env:
          # clerkSetup() reads these two to mint the testing token that gets
          # past bot protection; signIn() reads the secret key to create the
          # session server-side, which skips the email code entirely.
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
