name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLERK_PUBLISHABLE_KEY     - Clerk test-mode publishable key (pk_test_...)
#   CLERK_SECRET_KEY          - Clerk test-mode secret key (sk_test_...)
#   NEXT_PUBLIC_BACKEND_URL   - Backend API base URL (e.g. http://localhost:7071 in local dev)
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    # Vitest 4 requires Node >= 20.12 (uses node:util styleText), so Node 18
    # is intentionally not in the matrix anymore.
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  # E2E is disabled until the specs have Clerk test-user auth.
  # The middleware protects every route (auth.protect()), and the specs
  # navigate to /dashboard and /library without logging in, so they get
  # redirected to /sign-in and fail. Re-enable after adding a Playwright
  # global setup that signs in with Clerk test credentials.
